services:
  - type: web
    name: app-pedidos
    env: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /cliente.html
    envVars:
      - key: RRHH_DATABASE_URL
        sync: false
      - key: ADMINISTRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
