<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mayoristas | San Cayetano Carnes</title>
    <link rel="stylesheet" href="/styles.css?v=20260815-identidad-integral">
  </head>
  <body class="client-page">
    <main class="client-shell">
      <section class="panel client-panel wholesale-register-panel">
        <div class="client-brand wholesale-brand">
          <img src="/san-cayetano-logo-blanco.png" alt="San Cayetano Carnes" class="client-logo">
          <div class="client-brand-copy">
            <p class="eyebrow">Agenda comercial</p>
            <h1>Alta mayorista</h1>
            <p>Completá tus datos para incorporarte a nuestra red comercial.</p>
          </div>
        </div>
        <form id="wholesaleCustomerForm" class="wholesale-register-form">
          <div class="grid two">
            <label>Nombre o razon social
              <input id="wholesaleName" required maxlength="120" autocomplete="organization">
            </label>
            <label>Telefono / WhatsApp
              <input id="wholesalePhone" required minlength="8" maxlength="40" inputmode="tel" autocomplete="tel">
            </label>
          </div>
          <label>Direccion, localidad o referencia
            <input id="wholesaleAddress" maxlength="200" autocomplete="street-address">
          </label>
          <label>CUIT
            <input id="wholesaleCuit" maxlength="13" inputmode="numeric" autocomplete="off" placeholder="11 digitos">
          </label>
          <label>Numero de cliente o marcada (Por favor, detallar el numero de cliente con el que va marcada la carne)
            <input id="wholesaleCustomerNumber" maxlength="80" autocomplete="off">
          </label>
          <label>Observaciones
            <textarea id="wholesaleNotes" rows="4" maxlength="500" placeholder="Horarios, referencias u otras aclaraciones"></textarea>
          </label>
          <p id="wholesaleMessage" class="message" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button class="primary" type="submit">Enviar datos</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/mayorista.js?v=20260722-alta-mayorista"></script>
  </body>
</html>
